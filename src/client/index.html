<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Farce - Multiplayer</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #050505; color:#aaa; font-family: monospace; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
        #hud { position: absolute; top: 20px; left: 20px; z-index: 20; pointer-events: none; text-shadow: 1px 1px 0 #000; font-size: 18px; color: #4a9; font-weight: bold;}
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div id="hud">SECTOR SECURED: AWAITING DEPLOYMENT</div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const hud = document.getElementById('hud');
        let width = window.innerWidth, height = window.innerHeight;
        
        function resize() { width = window.innerWidth; height = window.innerHeight; canvas.width = width; canvas.height = height; }
        window.addEventListener('resize', resize); resize();

        const socket = io();
        let myId = null;
        let serverState = { players: {}, bullets: [], turrets: [] };
        let renderState = { players: {} }; 
        let level = null;
        let camera = { x: 0, y: 0 };
        let particles = [];

        const inputs = { up: false, left: false, right: false, shoot: false };
        
        function emitInputs() { socket.emit('input', inputs); }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Shift' || e.code === 'KeyS') inputs.up = true;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') inputs.left = true;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') inputs.right = true;
            if (e.code === 'Return' || e.code === 'ArrowUp' || e.code === 'KeyW') inputs.shoot = true;
            emitInputs();
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'Shift' || e.code === 'KeyS') inputs.up = false;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') inputs.left = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') inputs.right = false;
            if (e.code === 'Return' || e.code === 'ArrowUp' || e.code === 'KeyW') inputs.shoot = false;
            emitInputs();
        });

        socket.on('connect', () => { myId = socket.id; });
        socket.on('initLevel', (data) => { 
            level = data; 
            hud.innerText = level.name;
            renderState.players = {}; // Clear old players on level swap
        });
        
        socket.on('state', (state) => {
            serverState = state;
            for (let id in serverState.players) {
                let s = serverState.players[id];
                let r = renderState.players[id];
                if (!r) {
                    renderState.players[id] = { ...s };
                } else if (!r.isDead && s.isDead) {
                    // Trigger explosion the moment the server says a ship died
                    spawnParticles(s.x, s.y, s.vx, s.vy, '#f80', 60, 80);
                    spawnParticles(s.x, s.y, s.vx, s.vy, '#f00', 40, 60);
                    spawnParticles(s.x, s.y, s.vx, s.vy, '#fff', 30, 40);
                    
                    // Force reset local inputs so we don't hold thrust/fire while dead
                    if (id === myId) {
                        inputs.up = inputs.left = inputs.right = inputs.shoot = false;
                        emitInputs();
                    }
                }
            }
            
            // Clean up disconnected ghost ships
            for (let id in renderState.players) {
                if (!serverState.players[id]) {
                    delete renderState.players[id];
                }
            }
        });

        function spawnParticles(x, y, vx, vy, color, count, lifeSpan) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: vx + (Math.random() - 0.5) * 4,
                    vy: vy + (Math.random() - 0.5) * 4,
                    life: lifeSpan * (0.5 + Math.random() * 0.5),
                    color: color,
                    size: Math.random() * 2 + 1
                });
            }
        }

        function updateAndDrawParticles(ctx) {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy;
                p.vx *= 0.98; p.vy *= 0.98; 
                p.life--;
                if (p.life <= 0) { particles.splice(i, 1); continue; }
                ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size);
            }
        }

        function lerp(start, end, amt) { return (1 - amt) * start + amt * end; }
        function lerpAngle(a, b, amt) {
            let d = b - a;
            while (d > Math.PI) d -= Math.PI * 2;
            while (d < -Math.PI) d += Math.PI * 2;
            return a + d * amt;
        }

        function drawShip(p, isMe) {
            if (p.isDead) return;
            ctx.save();
            ctx.translate(p.x, p.y); ctx.rotate(p.angle);
            ctx.strokeStyle = isMe ? '#4a9' : '#a44'; 
            ctx.lineWidth = 1.5; ctx.fillStyle = '#222';
            
            ctx.beginPath();
            ctx.moveTo(16, 0); ctx.lineTo(-16, 11.2); ctx.lineTo(-8, 0); ctx.lineTo(-16, -11.2); 
            ctx.closePath(); ctx.fill(); ctx.stroke();
            
            if (p.inputs && p.inputs.up) {
                ctx.fillStyle = '#48f';
                ctx.beginPath();
                ctx.moveTo(-8, 0); ctx.lineTo(-16 - Math.random()*15, 0);
                ctx.lineTo(-8, 2); ctx.lineTo(-8, -2); ctx.fill();
            }
            ctx.restore();
        }

        function drawTurret(t) {
            if (!t.active) return;
            ctx.save(); ctx.translate(t.x, t.y);
            
            ctx.fillStyle = '#333'; ctx.strokeStyle = '#555';
            ctx.fillRect(-15, t.orientUp ? -10 : 0, 30, 10);
            ctx.strokeRect(-15, t.orientUp ? -10 : 0, 30, 10);
            
            ctx.rotate(t.angle);
            ctx.fillStyle = '#666'; ctx.fillRect(0, -4, 25, 8);
            ctx.fillStyle = '#f44'; ctx.fillRect(20, -2, 5, 4);
            ctx.restore();
        }

        function gameLoop() {
            requestAnimationFrame(gameLoop);
            ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, width, height);
            if (!level) return;

            // Interpolation
            for (let id in serverState.players) {
                let s = serverState.players[id];
                let r = renderState.players[id];
                if (r) {
                    // Snap position instantly if reviving or teleporting far, otherwise lerp smoothly
                    let dist = Math.hypot(r.x - s.x, r.y - s.y);
                    if ((r.isDead && !s.isDead) || dist > 100) {
                        r.x = s.x; r.y = s.y; r.angle = s.angle;
                    } else {
                        r.x = lerp(r.x, s.x, 0.3); r.y = lerp(r.y, s.y, 0.3);
                        r.angle = lerpAngle(r.angle, s.angle, 0.3);
                    }
                    r.isDead = s.isDead; r.inputs = s.inputs;
                }
            }

            let myPlayer = renderState.players[myId];
            if (myPlayer) {
                camera.x += (myPlayer.x - width / 2 - camera.x) * 0.1;
                camera.y += (myPlayer.y - height / 2 - camera.y) * 0.1;
            }

            ctx.save();
            ctx.translate(Math.floor(-camera.x), Math.floor(-camera.y));

            // Map
            ctx.fillStyle = '#0d1117'; ctx.strokeStyle = '#2d3748'; ctx.lineWidth = 3;
            
            ctx.beginPath(); ctx.moveTo(level.ceiling[0].x, -3000);
            for (let p of level.ceiling) ctx.lineTo(p.x, p.y); ctx.lineTo(level.ceiling[level.ceiling.length-1].x, -3000);
            ctx.fill(); ctx.stroke();

            ctx.beginPath(); ctx.moveTo(level.floor[0].x, 3000);
            for (let p of level.floor) ctx.lineTo(p.x, p.y); ctx.lineTo(level.floor[level.floor.length-1].x, 3000);
            ctx.fill(); ctx.stroke();

            // Pads
            for (let pad of [level.startPad, level.endPad]) {
                ctx.fillStyle = '#111'; ctx.fillRect(pad.x, pad.y, pad.w, 20);
                ctx.fillStyle = '#4a9'; ctx.fillRect(pad.x, pad.y, pad.w, 4);
            }

            if (serverState.turrets) serverState.turrets.forEach(drawTurret);
            for (let id in renderState.players) drawShip(renderState.players[id], id === myId);
            
            ctx.fillStyle = '#ff8';
            for (let b of serverState.bullets) ctx.fillRect(b.x - 2, b.y - 2, 4, 4);
            updateAndDrawParticles(ctx);

            ctx.restore();
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
