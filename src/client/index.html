<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Farce - Multiplayer</title>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: #050505; color: #eee; 
            font-family: system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            overflow: hidden; 
        }
        #gameCanvas { 
            display: block;
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: center center;
        }
        #hud { 
            position: absolute; top: 24px; left: 24px; z-index: 20; pointer-events: none; 
            font-size: 16px; font-weight: 600; letter-spacing: 1px; color: rgba(255, 255, 255, 0.9);
            background: rgba(20, 25, 30, 0.6);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 12px 24px; border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4); text-transform: uppercase;
        }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div id="hud">SECTOR SECURED: AWAITING DEPLOYMENT</div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const hud = document.getElementById('hud');
        
        // Enforce Competitive Fixed Viewport
        const VIEW_W = 1600;
        const VIEW_H = 900;
        canvas.width = VIEW_W;
        canvas.height = VIEW_H;

        function resize() { 
            const scale = Math.min(window.innerWidth / VIEW_W, window.innerHeight / VIEW_H);
            canvas.style.transform = `translate(-50%, -50%) scale(${scale})`;
        }
        window.addEventListener('resize', resize); resize();

        const socket = io();
        let myId = null;
        let serverState = { players: {}, bullets: [], turrets: [] };
        let renderState = { players: {} }; 
        let level = null;
        let camera = { x: 0, y: 0 };
        let particles = [];

        const KNOWN_TILES = [
            0x01, 0x02, 0x03, 0x04, 0x05, 0x06, 0x07, 0x08, 0x09, 0x0A, 0x0B, 0x0C, 0x0D, 0x0E, 0x0F,
            0x10, 0x11, 0x12, 0x13, 0x14, 0x15, 0x16, 0x18, 0x19, 0x1A, 0x1B, 0x1C, 0x1D, 0x1E,
            0x1F, 0x24, 0x25, 0x26, 
            0x27, 0x29, 0x2A, 0x2B, 0x2C, 0x2D, 0x2E, 
            0x31, 0x32, 0x33, 0x34, 0x35, 0x36, 0x37, 0x38,
            0x39, 0x3A, 0x5E, 0x5F, 0x60, 
            0x61, 0x62, 0x63, 0x64, 0x65, 0x66, 
            0x67,
            0x68, 0x69, 0x6A, 0x6B, 0x6C, 0x6D, 0x6E, 0x73, 
            0x74, 0x75, 0x76, 0x77, 0x79, 0x7A, 0x7B,
            0x7D, 0x7E,
            0x82, 0x83, 0x86, 0x88, 0x89,
            0x87, 0x89, 0x8A, 0x8B, 0x8F, 0xD1, 
            0xDA, 0xDB, 0xDC, 0xDD, 0xDE, 0xDF, 0xE0, 0xE1, 
            0xE7, 0xF0, 0xF1, 0xF2,
            0xF3, 0xF8, 0xF9, 0xFA, 0xFB
        ];

        const inputs = { up: false, left: false, right: false, shoot: false };
        
        function emitInputs() { socket.emit('input', inputs); }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Shift' || e.code === 'KeyS') inputs.up = true;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') inputs.left = true;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') inputs.right = true;
            if (e.code === 'Return' || e.code === 'ArrowUp' || e.code === 'KeyW') inputs.shoot = true;
            emitInputs();
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'Shift' || e.code === 'KeyS') inputs.up = false;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') inputs.left = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') inputs.right = false;
            if (e.code === 'Return' || e.code === 'ArrowUp' || e.code === 'KeyW') inputs.shoot = false;
            emitInputs();
        });

        socket.on('connect', () => { myId = socket.id; });
        socket.on('initLevel', (data) => { 
            level = data; 
            hud.innerText = level.name;
            renderState.players = {}; // Clear old players on level swap
        });
        
        socket.on('state', (state) => {
            serverState = state;
            for (let id in serverState.players) {
                let s = serverState.players[id];
                let r = renderState.players[id];
                if (!r) {
                    renderState.players[id] = { ...s };
                } else if (!r.isDead && s.isDead) {
                    // Trigger explosion the moment the server says a ship died
                    spawnParticles(s.x, s.y, s.vx, s.vy, '#f80', 60, 80);
                    spawnParticles(s.x, s.y, s.vx, s.vy, '#f00', 40, 60);
                    spawnParticles(s.x, s.y, s.vx, s.vy, '#fff', 30, 40);
                    
                    // Force reset local inputs so we don't hold thrust/fire while dead
                    if (id === myId) {
                        inputs.up = inputs.left = inputs.right = inputs.shoot = false;
                        emitInputs();
                    }
                }
            }
            
            // Clean up disconnected ghost ships
            for (let id in renderState.players) {
                if (!serverState.players[id]) {
                    delete renderState.players[id];
                }
            }
        });

        function spawnParticles(x, y, vx, vy, color, count, lifeSpan) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: vx + (Math.random() - 0.5) * 4,
                    vy: vy + (Math.random() - 0.5) * 4,
                    life: lifeSpan * (0.5 + Math.random() * 0.5),
                    color: color,
                    size: Math.random() * 2 + 1
                });
            }
        }

        function updateAndDrawParticles(ctx) {
            ctx.globalCompositeOperation = 'lighter';
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy;
                p.vx *= 0.98; p.vy *= 0.98; 
                p.life--;
                if (p.life <= 0) { particles.splice(i, 1); continue; }
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
            }
            ctx.globalCompositeOperation = 'source-over';
        }

        function lerp(start, end, amt) { return (1 - amt) * start + amt * end; }
        function lerpAngle(a, b, amt) {
            let d = b - a;
            while (d > Math.PI) d -= Math.PI * 2;
            while (d < -Math.PI) d += Math.PI * 2;
            return a + d * amt;
        }

        function drawShip(p, isMe) {
            if (p.isDead) return;
            ctx.save();
            ctx.translate(p.x, p.y); ctx.rotate(p.angle);
            
            ctx.beginPath();
            ctx.moveTo(16, 0); ctx.lineTo(-16, 11.2); ctx.lineTo(-8, 0); ctx.lineTo(-16, -11.2); 
            ctx.shadowBlur = isMe ? 10 : 0;
            ctx.shadowColor = isMe ? '#4facfe' : 'transparent';
            ctx.strokeStyle = isMe ? '#4facfe' : '#ff4b2b'; 
            ctx.lineWidth = 1.5; ctx.fillStyle = '#1a1a24';
            
            ctx.closePath(); ctx.fill(); ctx.stroke();
            
            ctx.shadowBlur = 0;
            
            if (p.inputs && p.inputs.up) {
                ctx.fillStyle = '#4facfe';
                ctx.beginPath();
                ctx.moveTo(-8, 0); ctx.lineTo(-16 - Math.random()*15, 0);
                ctx.lineTo(-8, 2); ctx.lineTo(-8, -2); ctx.fill();
            }
            ctx.restore();
        }

        function drawTurret(t) {
            if (!t.active) return;
            ctx.save(); ctx.translate(t.x, t.y);
            
            ctx.fillStyle = '#333'; ctx.strokeStyle = '#555';
            ctx.fillRect(-15, t.orientUp ? -8 : 0, 30, 8);
            ctx.strokeRect(-15, t.orientUp ? -8 : 0, 30, 8);
            
            ctx.rotate(t.angle);
            ctx.fillStyle = '#666'; ctx.fillRect(0, -4, 25, 8);
            ctx.fillStyle = '#f44'; ctx.fillRect(20, -2, 5, 4);
            ctx.restore();
        }

        function gameLoop() {
            requestAnimationFrame(gameLoop);
            ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
            if (!level) return;

            // Interpolation
            for (let id in serverState.players) {
                let s = serverState.players[id];
                let r = renderState.players[id];
                if (r) {
                    // Snap position instantly if reviving or teleporting far, otherwise lerp smoothly
                    let dist = Math.hypot(r.x - s.x, r.y - s.y);
                    if ((r.isDead && !s.isDead) || dist > 100) {
                        r.x = s.x; r.y = s.y; r.angle = s.angle;
                    } else {
                        r.x = lerp(r.x, s.x, 0.3); r.y = lerp(r.y, s.y, 0.3);
                        r.angle = lerpAngle(r.angle, s.angle, 0.3);
                    }
                    r.isDead = s.isDead; r.inputs = s.inputs;
                }
            }

            let myPlayer = renderState.players[myId];
            if (myPlayer) {
                let targetX = myPlayer.x - VIEW_W / 2;
                let targetY = myPlayer.y - VIEW_H / 2;
                
                // Clamp camera strictly to map bounds
                targetX = Math.max(0, Math.min(targetX, level.width - VIEW_W));
                targetY = Math.max(0, Math.min(targetY, level.height - VIEW_H));

                camera.x += (targetX - camera.x) * 0.1;
                camera.y += (targetY - camera.y) * 0.1;
            }

            ctx.save();
            ctx.translate(Math.floor(-camera.x), Math.floor(-camera.y));

            // Map
            ctx.fillStyle = '#0d1117'; ctx.strokeStyle = '#2d3748'; ctx.lineWidth = 3;
            
            if (level.ceiling && level.ceiling.length > 0) {
                ctx.beginPath(); ctx.moveTo(level.ceiling[0].x, -3000);
                for (let p of level.ceiling) ctx.lineTo(p.x, p.y); ctx.lineTo(level.ceiling[level.ceiling.length-1].x, -3000);
                ctx.fill(); ctx.stroke();
            }

            if (level.floor && level.floor.length > 0) {
                ctx.beginPath(); ctx.moveTo(level.floor[0].x, 3000);
                for (let p of level.floor) ctx.lineTo(p.x, p.y); ctx.lineTo(level.floor[level.floor.length-1].x, 3000);
                ctx.fill(); ctx.stroke();
            }

            if (level.walls) {
                for (let wall of level.walls) {
                    ctx.beginPath(); ctx.moveTo(wall[0].x, wall[0].y);
                    for (let p of wall) ctx.lineTo(p.x, p.y);
                    ctx.fill(); ctx.stroke();
                }
            }

            // Pads
            if (level.entities) {
                level.entities.filter(e => e.type === 'pad').forEach(pad => {
                    ctx.fillStyle = '#111'; ctx.fillRect(pad.x, pad.y, pad.w || 20, pad.h || 20);
                    ctx.fillStyle = '#4a9'; ctx.fillRect(pad.x, pad.y, pad.w || 20, 4);
                });
            }

            if (serverState.turrets) serverState.turrets.forEach(drawTurret);
            for (let id in renderState.players) drawShip(renderState.players[id], id === myId);
            
            // Debug Tile Overlay
            if (level.rawMap) {
                ctx.font = '600 14px system-ui, monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                for (let y = 0; y < level.rawMap.length; y++) {
                    for (let x = 0; x < level.rawMap[y].length; x++) {
                        const tile = level.rawMap[y][x];
                        if(tile !== 0) {
                            if (KNOWN_TILES.includes(tile)) {
                                ctx.fillStyle = 'rgba(255, 255, 255, 0.07)';
                            } else {
                                ctx.fillStyle = 'rgba(255, 255, 255, 1.0)';
                            }
                            ctx.fillText(tile.toString(16).toUpperCase().padStart(2, '0'), x * 32 + 16, y * 32 + 16);
                        }
                    }
                }
            }

            ctx.fillStyle = '#ff8';
            for (let b of serverState.bullets) ctx.fillRect(b.x - 2, b.y - 2, 4, 4);
            updateAndDrawParticles(ctx);

            ctx.restore();
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
