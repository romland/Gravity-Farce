<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Gravity Farce - Multiplayer</title>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: #050505; color: #eee; 
            font-family: system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            overflow: hidden;
            touch-action: none;
        }
        #gameCanvas { 
            display: block;
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: center center;
        }
        #hud { 
            position: absolute; top: 24px; left: 24px; z-index: 20; pointer-events: none; 
            font-size: 16px; font-weight: 600; letter-spacing: 1px; color: rgba(255, 255, 255, 0.9);
            background: rgba(20, 25, 30, 0.6);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 12px 24px; border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4); text-transform: uppercase;
        }
        #touch-controls {
            position: absolute; bottom: 40px; left: 40px; right: 40px;
            display: none; justify-content: space-between; z-index: 50;
            pointer-events: none; user-select: none; -webkit-user-select: none;
        }
        @media (hover: none) and (pointer: coarse) {
            #touch-controls { display: flex; }
        }
        .tbtn {
            width: 72px; height: 72px; border-radius: 36px;
            background: rgba(20, 25, 30, 0.65);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.85); font-size: 26px; pointer-events: auto;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4); margin: 0 12px; transition: background 0.1s, transform 0.1s;
            display: flex; align-items: center; justify-content: center;
        }
        .tbtn:active { background: rgba(255, 255, 255, 0.25); transform: scale(0.95); }
        .dpad, .action-pad { display: flex; align-items: flex-end; }
        .fire-btn { width: 92px; height: 92px; border-radius: 46px; background: rgba(255, 75, 43, 0.5); border-color: rgba(255, 75, 43, 0.6); font-size: 32px; font-weight: bold; color: #fff;}
        .fire-btn:active { background: rgba(255, 75, 43, 0.8); }
        
        #leaderboard-modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(15, 20, 25, 0.9); backdrop-filter: blur(10px);
            border: 2px solid #4facfe; border-radius: 12px;
            width: 400px; max-height: 80vh; overflow-y: auto;
            display: none; flex-direction: column; z-index: 100;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8); padding: 20px;
        }
        .board-title { color: #f1c40f; text-align: center; margin-bottom: 12px; font-weight: bold; letter-spacing: 1px; }
        .board-table { width: 100%; border-collapse: collapse; margin-bottom: 24px; font-family: monospace; }
        .board-table th { border-bottom: 1px solid rgba(255,255,255,0.2); padding: 8px 4px; text-align: left; color: #888; }
        .board-table td { padding: 8px 4px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .board-table tr:nth-child(1) td { color: #f1c40f; font-weight: bold; }
        .board-table tr:nth-child(2) td { color: #bdc3c7; font-weight: bold; }
        .board-table tr:nth-child(3) td { color: #cd7f32; font-weight: bold; }
        .btn-close {
            background: #4facfe; color: #000; border: none; padding: 10px; font-weight: bold;
            border-radius: 6px; cursor: pointer; text-align: center; font-size: 16px; margin-top: auto;
        }
        .btn-close:hover { background: #3a9ade; }
    </style>
    <script src="/socket.io/socket.io.js"></script>
    <script src="AssetManager.js"></script>
</head>
<body>
    <div id="loading-screen" style="position:absolute; top:0; left:0; width:100%; height:100%; background:#050505; z-index:100; display:flex; align-items:center; justify-content:center; flex-direction:column; color:#4facfe; font-weight:bold; letter-spacing:2px;">
        <img id="loader-img" src="assets/loader-detailed.webp" style="max-width:256px; margin-bottom:24px; display:none;" />
        <div id="loading-text">INITIALIZING SYSTEMS...</div>
    </div>
    <div id="hud">SECTOR SECURED: AWAITING DEPLOYMENT</div>
    <canvas id="gameCanvas"></canvas>
    <div id="touch-controls">
        <div class="dpad">
            <div id="btn-left" class="tbtn">◀</div>
            <div id="btn-thrust" class="tbtn">▲</div>
            <div id="btn-right" class="tbtn">▶</div>
        </div>
        <div class="action-pad">
            <div id="btn-fire" class="tbtn fire-btn">◎</div>
        </div>
    </div>
    
    <div id="leaderboard-modal"><div id="leaderboard-content"></div><button class="btn-close" onclick="document.getElementById('leaderboard-modal').style.display='none'">DISMISS</button></div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const hud = document.getElementById('hud');
        
        // Enforce Competitive Fixed Viewport
        const VIEW_W = 1600;
        const VIEW_H = 900;
        canvas.width = VIEW_W;
        canvas.height = VIEW_H;

        function resize() { 
            const scale = Math.min(window.innerWidth / VIEW_W, window.innerHeight / VIEW_H);
            canvas.style.transform = `translate(-50%, -50%) scale(${scale})`;
        }
        window.addEventListener('resize', resize); resize();

        const assetManager = new AssetManager();

        let myUuid = localStorage.getItem('gf_uuid');
        if (!myUuid) {
            myUuid = crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).substring(2) + Date.now().toString(36);
            localStorage.setItem('gf_uuid', myUuid);
        }
        let myAlias = localStorage.getItem('gf_alias');
        if (!myAlias) {
            myAlias = (prompt("Enter your 3-letter Arcade Alias:", "AAA") || "AAA").substring(0, 3).toUpperCase();
            localStorage.setItem('gf_alias', myAlias);
        }

        const socket = io({ autoConnect: false, auth: { uuid: myUuid, alias: myAlias } });
        let myId = null;
        let serverState = { players: {}, bullets: [], turrets: [], tanks: [], flying: [], cargos: [], powerups: [] };
        let renderState = { players: {} }; 
        let level = null;
        let camera = { x: 0, y: 0 };
        let particles = [];
        let floatingTexts = [];
        let lastHudHTML = "";
        let raceLights = [];

        const inputs = { up: false, left: false, right: false, shoot: false };
        
        function emitInputs() { socket.emit('input', inputs); }

        function bindTouch(id, key) {
            const el = document.getElementById(id);
            if (!el) return;
            el.addEventListener('touchstart', (e) => { e.preventDefault(); inputs[key] = true; emitInputs(); }, {passive: false});
            el.addEventListener('touchend', (e) => { e.preventDefault(); inputs[key] = false; emitInputs(); }, {passive: false});
            el.addEventListener('touchcancel', (e) => { e.preventDefault(); inputs[key] = false; emitInputs(); }, {passive: false});
        }
        bindTouch('btn-left', 'left');
        bindTouch('btn-right', 'right');
        bindTouch('btn-thrust', 'up');
        bindTouch('btn-fire', 'shoot');

        let freecam = false;
        let debugMode = false;
        const camKeys = { up: false, down: false, left: false, right: false };

        window.addEventListener('keydown', (e) => {
            if (document.activeElement.tagName === 'INPUT') return;
            
            if (debugMode) {
                if (e.code === 'KeyP') { socket.emit('debug_action', 'pause'); return; }
                if (e.code === 'KeyC') { freecam = !freecam; return; }
                if (e.code === 'KeyL' || e.code === 'KeyJ') {
                    const lvl = prompt("Jump to level (0-99):");
                    if (lvl !== null && !isNaN(parseInt(lvl))) {
                        socket.emit('debug_action', 'jump', { levelIndex: parseInt(lvl) });
                    }
                    return;
                }
            }
            
            if (e.code === 'Shift' || e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'KeyS' || e.code === 'Numpad5') inputs.up = true;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA' || e.code === 'Numpad4') inputs.left = true;
            if (e.code === 'ArrowRight' || e.code === 'KeyD' || e.code === 'Numpad6') inputs.right = true;
            if (e.code === 'Return' || e.code === 'Enter' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Numpad8') inputs.shoot = true;

            if (freecam) {
                if (e.code === 'ArrowUp') camKeys.up = true;
                if (e.code === 'ArrowDown') camKeys.down = true;
                if (e.code === 'ArrowLeft') camKeys.left = true;
                if (e.code === 'ArrowRight') camKeys.right = true;
            } else {
                emitInputs();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'Shift' || e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'KeyS' || e.code === 'Numpad5') inputs.up = false;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA' || e.code === 'Numpad4') inputs.left = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD' || e.code === 'Numpad6') inputs.right = false;
            if (e.code === 'Return' || e.code === 'Enter' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Numpad8') inputs.shoot = false;

            if (freecam) {
                if (e.code === 'ArrowUp') camKeys.up = false;
                if (e.code === 'ArrowDown') camKeys.down = false;
                if (e.code === 'ArrowLeft') camKeys.left = false;
                if (e.code === 'ArrowRight') camKeys.right = false;
            } else {
                emitInputs();
            }
        });

        socket.on('connect', () => { 
            myId = socket.id; 
            
            // Dev-reload quality-of-life mechanism
            const savedLevel = localStorage.getItem('gf_dev_level');
            if (savedLevel !== null) {
                socket.emit('debug_action', 'jump', { levelIndex: parseInt(savedLevel) });
            }
        });
        
        let tileDictionary = {};
        socket.on('initTiles', (dict) => { 
            tileDictionary = dict; 
        });
        
        socket.on('serverConfig', (config) => { 
            debugMode = config.debugMode; 
        });
        
        socket.on('levelIndex', (idx) => {
            localStorage.setItem('gf_dev_level', idx.toString());
        });
        
        socket.on('initLevel', (data) => { 
            level = data;
            renderState.players = {}; // Clear old players on level swap
            
            raceLights = [];
            if (level.rawMap) {
                for(let y=0; y<level.rawMap.length; y++) {
                    for(let x=0; x<level.rawMap[y].length; x++) {
                        let t = level.rawMap[y][x];
                        if (t >= 0x3B && t <= 0x42) raceLights.push({ x: x*32, y: y*32, id: t });
                    }
                }
            }
        });
        
        socket.on('tile_update', (data) => {
            if (level && level.rawMap && level.rawMap[data.y]) {
                level.rawMap[data.y][data.x] = data.tile;
            }
        });

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function formatTimeMs(diff) {
            let m = Math.floor(diff / 60000).toString().padStart(2, '0');
            let s = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
            let ms = Math.floor((diff % 1000) / 10).toString().padStart(2, '0');
            return `${m}:${s}.${ms}`;
        }

        function playTurretSound(soundId) {
            if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            if (soundId === 8) {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(110, now + 0.12);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc.start(now); osc.stop(now + 0.12);
            } else if (soundId === 10) {
                osc.type = 'square';
                osc.frequency.setValueAtTime(320, now);
                osc.frequency.exponentialRampToValueAtTime(80, now + 0.15);
                gain.gain.setValueAtTime(0.18, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (soundId === 12) {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(150, now + 0.18);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
                osc.start(now); osc.stop(now + 0.18);
            } else {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(520, now);
                osc.frequency.exponentialRampToValueAtTime(220, now + 0.08);
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now); osc.stop(now + 0.08);
            }
        }        
        socket.on('state', (state) => {
            serverState = state;
            
            if (state.events) {
                for (let ev of state.events) {
                    if (ev.type === 'poof') {
                        spawnParticles(ev.x, ev.y, 0, 0, '#ffffff', 5, 10);
                    } else if (ev.type === 'turret_explosion') {
                        spawnParticles(ev.x, ev.y, 0, 0, '#ffaa00', 40, 50);
                        spawnParticles(ev.x, ev.y, 0, 0, '#ff0000', 20, 30);
                        spawnParticles(ev.x, ev.y, 0, 0, '#ffffff', 10, 20);
                    } else if (ev.type === 'sound') {
                        playTurretSound(ev.soundId);
                    } else if (ev.type === 'floating_text') {
                        floatingTexts.push({ text: ev.text, x: ev.x, y: ev.y, color: ev.color || '#fff', life: 60, maxLife: 60 });
                    }
                }
            }
            
            for (let id in serverState.players) {
                let s = serverState.players[id];
                let r = renderState.players[id];
                if (!r) {
                    renderState.players[id] = { ...s };
                } else if (!r.isDead && s.isDead) {
                    // Trigger explosion the moment the server says a ship died
                    spawnParticles(s.x, s.y, s.vx, s.vy, '#f80', 60, 80);
                    spawnParticles(s.x, s.y, s.vx, s.vy, '#f00', 40, 60);
                    spawnParticles(s.x, s.y, s.vx, s.vy, '#fff', 30, 40);
                    
                    // Force reset local inputs so we don't hold thrust/fire while dead
                    if (id === myId) {
                        inputs.up = inputs.left = inputs.right = inputs.shoot = false;
                        emitInputs();
                    }
                }
            }
            
            // Clean up disconnected ghost ships
            for (let id in renderState.players) {
                if (!serverState.players[id]) {
                    delete renderState.players[id];
                }
            }
        });

    socket.on('show_leaderboard', (boards) => {
        let modal = document.getElementById('leaderboard-modal');
        if (!modal) return; // Failsafe in case HTML wasn't added
        let html = '';
        boards.forEach(b => {
            html += `<div class="board-title">${b.title}</div><table class="board-table"><tr><th>RANK</th><th>PILOT</th><th style="text-align:right">TIME</th></tr>`;
            b.entries.forEach((e, idx) => {
                let isMe = e.playerId === myUuid ? 'style="color:#2ecc71"' : '';
                html += `<tr ${isMe}><td>#${idx+1}</td><td>${e.alias}</td><td style="text-align:right">${formatTimeMs(e.value)}</td></tr>`;
            });
            html += `</table>`;
        });
        document.getElementById('leaderboard-content').innerHTML = html;
        modal.style.display = 'flex';
    });

        function spawnParticles(x, y, vx, vy, color, count, lifeSpan) {
            for (let i = 0; i < count; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 4;
                
                particles.push({
                    x: x, 
                    y: y,
                    vx: vx + Math.cos(angle) * speed,
                    vy: vy + Math.sin(angle) * speed,
                    life: lifeSpan * (0.5 + Math.random() * 0.5),
                    color: color,
                    size: Math.random() * 2 + 1
                });
            }
        }

        function updateAndDrawParticles(ctx) {
            ctx.globalCompositeOperation = 'lighter';
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; 
                p.y += p.vy;
                p.vx *= 0.98; 
                p.vy *= 0.98;
                p.life--;
                
                if (p.life <= 0) { 
                    particles.splice(i, 1); 
                    continue; 
                }
                
                ctx.fillStyle = p.color;
                ctx.beginPath(); 
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); 
                ctx.fill();
            }
            ctx.globalCompositeOperation = 'source-over';
        }

        function lerp(start, end, amt) { 
            return (1 - amt) * start + amt * end; 
        }
        
        function lerpAngle(a, b, amt) {
            let d = b - a;
            while (d > Math.PI) d -= Math.PI * 2;
            while (d < -Math.PI) d += Math.PI * 2;
            return a + d * amt;
        }

        function drawShip(p, isMe) {
            if (p.isDead) return;
            ctx.save();
            ctx.translate(Math.round(p.x), Math.round(p.y)); 
            ctx.rotate(p.angle);
            
            ctx.beginPath();
            ctx.moveTo(16, 0); 
            ctx.lineTo(-16, 11.2); 
            ctx.lineTo(-8, 0); 
            ctx.lineTo(-16, -11.2);
             
            ctx.shadowBlur = isMe ? 10 : 0;
            ctx.shadowColor = isMe ? '#4facfe' : 'transparent';
            ctx.strokeStyle = isMe ? '#4facfe' : '#ff4b2b';
            ctx.lineWidth = 1.5; 
            ctx.fillStyle = '#1a1a24';
            
            ctx.closePath(); 
            ctx.fill(); 
            ctx.stroke();
            
            ctx.shadowBlur = 0;
            
        if (p.inputs && p.inputs.up && p.fuel > 0) {
                ctx.fillStyle = '#4facfe';
                ctx.beginPath();
                ctx.moveTo(-8, 0); 
                ctx.lineTo(-16 - Math.random() * 15, 0);
                ctx.lineTo(-8, 2); 
                ctx.lineTo(-8, -2); 
                ctx.fill();
            }
            ctx.restore();
        }

        function drawTurret(t) {
            if (!t.active) return;
            ctx.save(); 
            ctx.translate(Math.round(t.x), Math.round(t.y));
            
            const tileId = t.type || 0xAF;
            
            // Orientation and mounting alignment per Amiga tile ID
            if (tileId === 0xB6) {
                ctx.rotate(Math.PI); // Ceiling mounted - pointing down (Native)
            } else if (tileId === 0xB7) {
                ctx.rotate(Math.PI / 2); // Wall mounted - facing east
            } else if (tileId === 0xB8) {
                ctx.rotate(-Math.PI / 2); // Wall mounted - facing west
            } else {
                ctx.rotate(0); // Floor mounted / default angle (Native UP)
            }
            
            // Base mount plate
            ctx.fillStyle = '#333'; 
            ctx.strokeStyle = '#555';
            ctx.fillRect(-15, 0, 30, 8);
            ctx.strokeRect(-15, 0, 30, 8);
            
            // Housing & Barrels matching exact firing patterns
            ctx.fillStyle = '#666';
            if (tileId === 0xBA || tileId === 0xB4 || tileId === 0xB5 || tileId === 0xB9) {
                // 5-way half-circle fan
                ctx.fillRect(-10, -12, 4, 12);
                ctx.fillRect(-5, -16, 4, 16);
                ctx.fillRect(-2, -18, 4, 18);
                ctx.fillRect(1, -16, 4, 16);
                ctx.fillRect(6, -12, 4, 12);
                ctx.fillStyle = '#f44';
                ctx.fillRect(-2, -20, 4, 2);
            } else if (tileId === 0xAF || tileId === 0xB0 || tileId === 0xAE) {
                // Multi-way cone (3-way / 4-way)
                ctx.fillRect(-8, -12, 4, 12);
                ctx.fillRect(-2, -16, 4, 16);
                ctx.fillRect(4, -12, 4, 12);
                ctx.fillStyle = '#f44';
                ctx.fillRect(-2, -18, 4, 2);
            } else {
                // Standard single stream (vertical, horizontal, angled)
                ctx.fillRect(-4, -16, 8, 16);
                ctx.fillStyle = '#f44';
                ctx.fillRect(-4, -18, 8, 2);
            }
            
            ctx.restore();
        }

        function drawTank(t) {
            if (!t.active) return;
            const w = t.width || 32;
            const h = t.height || 24;
            ctx.save(); 
            ctx.translate(Math.round(t.x), Math.round(t.y));
            ctx.fillStyle = '#8a8a8a'; 
            ctx.fillRect(-w / 2, -h / 2, w, h);
            ctx.fillStyle = '#ff4b2b';
            ctx.fillRect(-w / 4, -h / 4, w / 2, h / 2);
            ctx.restore();

            if (debugMode && t.debugId !== undefined) {
                ctx.fillStyle = '#0f0';
                ctx.font = '10px monospace';
                ctx.fillText(`ID:${t.debugId} (TANK)`, Math.round(t.x), Math.round(t.y - h / 2 - 10));
            }
        }

        function drawFlyingEnemy(t) {
            if (!t.active) return;
            const w = t.width || 96;
            const h = t.height || 64;
            ctx.save(); 
            ctx.translate(Math.round(t.x), Math.round(t.y));
            ctx.rotate(t.angle);
            
            const img = assetManager.get('0x' + t.enemyType.toString(16).toUpperCase());
            if (img) {
                ctx.drawImage(img, -w / 2, -h / 2, w, h);
            } else {
                ctx.fillStyle = '#ff8800'; 
                ctx.beginPath();
                ctx.moveTo(w, h / 2); ctx.lineTo(0, h); ctx.lineTo(0, 0);
                ctx.closePath();
                ctx.fill();
            }
            ctx.restore();

            if (debugMode && t.debugId !== undefined) {
                ctx.fillStyle = '#0f0';
                ctx.font = '10px monospace';
                ctx.fillText(`ID:${t.debugId} (0x${t.enemyType.toString(16).toUpperCase()})`, Math.round(t.x), Math.round(t.y - h / 2 - 10));
            }
        }

        function drawCargo(c) {
            ctx.save();
            ctx.translate(Math.round(c.x), Math.round(c.y));
            const size = c.weight === 2 ? 24 : 18;
            const isLarge = c.weight === 2;
            
            ctx.shadowBlur = 6;
            ctx.shadowColor = isLarge ? 'rgba(230, 126, 34, 0.5)' : 'rgba(241, 196, 15, 0.5)';
            
            ctx.fillStyle = isLarge ? '#2c1e14' : '#1e2417';
            ctx.strokeStyle = isLarge ? '#e67e22' : '#f1c40f';
            ctx.lineWidth = 1.5;
            
            ctx.beginPath();
            if (ctx.roundRect) {
                ctx.roundRect(-size / 2, -size / 2, size, size, 3);
            } else {
                ctx.rect(-size / 2, -size / 2, size, size);
            }
            ctx.fill();
            ctx.stroke();
            ctx.shadowBlur = 0;
            
            ctx.fillStyle = isLarge ? '#f39c12' : '#f1c40f';
            ctx.font = 'bold 10px system-ui, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(isLarge ? 'C2' : 'C1', 0, 1);
            
            ctx.restore();
        }

        function drawPowerup(p) {
            ctx.save();
            ctx.translate(Math.round(p.x), Math.round(p.y));
            const radius = 10;
            let label = 'PWR';
            let color = '#3498db';
            
            if (p.typeId === 0xD0) { label = 'FUEL'; color = '#e67e22'; }
            if (p.typeId === 0xD5) { label = 'PWR'; color = '#e74c3c'; }
            else if (p.typeId === 0xD6) { label = '2X'; color = '#2ecc71'; }
            else if (p.typeId === 0xD7) { label = '3X'; color = '#9b59b6'; }
            else if (p.typeId === 0xD8) { label = 'UTL'; color = '#f39c12'; }
            
            ctx.shadowBlur = 8;
            ctx.shadowColor = color;
            
            ctx.fillStyle = 'rgba(10, 14, 20, 0.9)';
            ctx.strokeStyle = color;
            ctx.lineWidth = 1.5;
            
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.shadowBlur = 0;
            
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 9px system-ui, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(label, 0, 1);
            
            ctx.restore();
        }

        // Global debug function to dump the enemy map to the console
        window.printEnemyPathMap = function() {
            if (!level || !level.rawMap) {
                console.log("Map not loaded yet.");
                return;
            }

            let out = `\n--- ENEMY PATH DEBUG MAP: ${level.name} ---\n`;
            for (let y = 0; y < level.rawMap.length; y++) {
                let rowStr = "";
                for (let x = 0; x < level.rawMap[y].length; x++) {
                    const t = level.rawMap[y][x];
                    if (t >= 0xE4 && t <= 0xEF) {
                        rowStr += t.toString(16).toUpperCase();
                    }
                    else if (t >= 0xF0 && t <= 0xFF) rowStr += t.toString(16).toUpperCase();
                    else if (t >= 0x32 && t <= 0x3A) rowStr += "T" + (t - 0x32);
                    else if (tileDictionary[t] && tileDictionary[t].solid) {
                        rowStr += "██";
                    } else if (t >= 0xAE && t <= 0xCB) {
                        // Turrets and zones: 0xAE to 0xCB
                        rowStr += "~~";
                    } else if (t == 0x0) {
                        rowStr += "  ";
                    } else {
                        rowStr += "..";
                    }
                }
                // Only print rows that actually have enemies or paths to save console space
                if (rowStr.match(/[EFT][0-9A-F]/)) {
                    out += `${y.toString().padStart(3, '0')} | ${rowStr}\n`;
                }
            }
            console.log(out);
        };

        function gameLoop() {
            requestAnimationFrame(gameLoop);
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.fillStyle = '#050505'; 
            ctx.fillRect(0, 0, VIEW_W, VIEW_H);
            if (!level) return;

            // Interpolation
            for (let id in serverState.players) {
                let s = serverState.players[id];
                let r = renderState.players[id];
                if (r) {
                    // Snap position instantly if reviving or teleporting far, otherwise lerp smoothly
                    let dist = Math.hypot(r.x - s.x, r.y - s.y);
                    if ((r.isDead && !s.isDead) || dist > 100) {
                        r.x = s.x; 
                        r.y = s.y; 
                        r.angle = s.angle;
                    } else {
                        r.x = lerp(r.x, s.x, 0.3); 
                        r.y = lerp(r.y, s.y, 0.3);
                        r.angle = lerpAngle(r.angle, s.angle, 0.3);
                    }
                    r.isDead = s.isDead; 
                    r.inputs = s.inputs;
                    r.score = s.score;
                    r.fuel = s.fuel;
                    r.cargoStack = s.cargoStack;
                    r.race = s.race;
                }
            }

            let myServerPlayer = serverState.players[myId];

            if (freecam) {
                const camSpeed = 15;
                if (camKeys.up) camera.y -= camSpeed;
                if (camKeys.down) camera.y += camSpeed;
                if (camKeys.left) camera.x -= camSpeed;
                if (camKeys.right) camera.x += camSpeed;
            } else {
                let myPlayer = renderState.players[myId];
                if (myPlayer && myServerPlayer) {
                    // let newHudHTML = `<div style="font-size: 1.2em; margin-bottom: 4px; color: #4facfe">${level.name}</div><div style="font-size: 0.85em; color: #aaa;">SCORE: <span style="color:#fff">${myPlayer.score.toString().padStart(6, '0')}</span> &nbsp;|&nbsp; FUEL: <span style="color:#e67e22">${Math.floor(myPlayer.fuel)}</span> &nbsp;|&nbsp; CARGO: <span style="color:#f1c40f">${myPlayer.cargoStack.length > 0 ? myPlayer.cargoStack.map(c => c===0xD1?'[C1]':'[C2]').join(' ') : 'NONE'}</span> &nbsp;|&nbsp; REMAINING: <span style="color:#fff">${serverState.cargosRemaining || 0}</span></div>`;
                    let raceUI = '';
                    if (myServerPlayer.race && myServerPlayer.race.state > 0) {
                        let r = myServerPlayer.race;
                        let diff = (r.state === 2 && r.finishTime) ? r.finishTime - r.startTime : Date.now() - r.startTime;
                        let m = Math.floor(diff / 60000).toString().padStart(2, '0');
                        let s = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
                        let ms = Math.floor((diff % 1000) / 10).toString().padStart(2, '0');
                        let color = r.state === 2 ? '#2ecc71' : '#fff';
                        raceUI = ` &nbsp;|&nbsp; LAP: <span style="color:#4facfe">${r.currentLap}/${r.totalLaps}</span> &nbsp;|&nbsp; TIME: <span style="color:${color}">${m}:${s}.${ms}</span>`;
                    }
                    let newHudHTML = `<div style="font-size: 1.2em; margin-bottom: 4px; color: #4facfe">${level.name}</div><div style="font-size: 0.85em; color: #aaa;">SCORE: <span style="color:#fff">${myServerPlayer.score.toString().padStart(6, '0')}</span> &nbsp;|&nbsp; FUEL: <span style="color:#e67e22">${Math.floor(myServerPlayer.fuel)}</span> &nbsp;|&nbsp; CARGO: <span style="color:#f1c40f">${myServerPlayer.cargoStack && myServerPlayer.cargoStack.length > 0 ? myServerPlayer.cargoStack.map(c => c===0xD1?'[C1]':'[C2]').join(' ') : 'NONE'}</span> &nbsp;|&nbsp; REMAINING: <span style="color:#fff">${serverState.cargosRemaining || 0}</span>${raceUI}</div>`;
                    if (newHudHTML !== lastHudHTML) {
                        hud.innerHTML = newHudHTML;
                        lastHudHTML = newHudHTML;
                    }
                    let targetX = myPlayer.x - VIEW_W / 2;
                    let targetY = myPlayer.y - VIEW_H / 2;
                    
                    // Clamp camera strictly to map bounds
                    targetX = Math.max(0, Math.min(targetX, level.width - VIEW_W));
                    targetY = Math.max(0, Math.min(targetY, level.height - VIEW_H));

                    camera.x += (targetX - camera.x) * 0.1;
                    camera.y += (targetY - camera.y) * 0.1;
                }
            }

            ctx.save();
            ctx.translate(Math.floor(-camera.x), Math.floor(-camera.y));

            // Map
            ctx.fillStyle = '#0d1117'; 
            ctx.strokeStyle = '#2d3748'; 
            ctx.lineWidth = 3;
            
            if (level.ceiling && level.ceiling.length > 0) {
                ctx.beginPath(); 
                ctx.moveTo(level.ceiling[0].x, -3000);
                for (let p of level.ceiling) {
                    ctx.lineTo(p.x, p.y);
                }
                ctx.lineTo(level.ceiling[level.ceiling.length-1].x, -3000);
                ctx.fill(); 
                ctx.stroke();
            }

            if (level.floor && level.floor.length > 0) {
                ctx.beginPath(); 
                ctx.moveTo(level.floor[0].x, 3000);
                for (let p of level.floor) {
                    ctx.lineTo(p.x, p.y);
                }
                ctx.lineTo(level.floor[level.floor.length-1].x, 3000);
                ctx.fill(); 
                ctx.stroke();
            }

            if (level.walls) {
                for (let wall of level.walls) {
                    ctx.beginPath(); 
                    ctx.moveTo(wall[0].x, wall[0].y);
                    for (let p of wall) {
                        ctx.lineTo(p.x, p.y);
                    }
                    ctx.fill(); 
                    ctx.stroke();
                }
            }

            // Pads
            if (level.entities) {
                level.entities.filter(e => e.type === 'pad').forEach(pad => {
                    ctx.fillStyle = '#111'; 
                    ctx.fillRect(pad.x, pad.y, pad.w || 20, pad.h || 20);
                    ctx.fillStyle = '#4a9'; 
                    ctx.fillRect(pad.x, pad.y, pad.w || 20, 4);
                });
            }

            if (serverState.cargos) {
                serverState.cargos.forEach(drawCargo);
            }
            
            if (serverState.powerups) {
                serverState.powerups.forEach(drawPowerup);
            }

            if (serverState.turrets) {
                serverState.turrets.forEach(drawTurret);
            }
            
            if (serverState.tanks) {
                serverState.tanks.forEach(drawTank);
            }
            
            if (serverState.flying) {
                serverState.flying.forEach(drawFlyingEnemy);
            }
            
            for (let id in renderState.players) {
                drawShip(renderState.players[id], id === myId);
            }
            
            // Debug Tile Overlay
            if (level.rawMap) {
                ctx.font = '600 14px system-ui, monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                for (let y = 0; y < level.rawMap.length; y++) {
                    for (let x = 0; x < level.rawMap[y].length; x++) {
                        const tile = level.rawMap[y][x];
                        if(tile !== 0) {
                            const tDef = tileDictionary[tile];
                            if (tDef && tDef.known) {
                                ctx.fillStyle = 'rgba(255, 255, 255, 0.07)';
                            } else {
                                ctx.fillStyle = 'rgba(255, 255, 255, 1.0)';
                            }
                            ctx.fillText(tile.toString(16).toUpperCase().padStart(2, '0'), x * 32 + 16, y * 32 + 16);
                        }
                    }
                }
            }

            for (let b of serverState.bullets) {
                if (b.isPlayer) {
                    ctx.fillStyle = '#ff8';
                    ctx.fillRect(b.x - 2, b.y - 2, 4, 4);
                } else {
                    ctx.fillStyle = '#f44';
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            updateAndDrawParticles(ctx);

            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                let ft = floatingTexts[i];
                ft.y -= 0.6;
                ft.life--;
                if (ft.life <= 0) {
                    floatingTexts.splice(i, 1);
                    continue;
                }
                ctx.save();
                ctx.globalAlpha = Math.max(0, ft.life / ft.maxLife);
                ctx.fillStyle = ft.color;
                ctx.font = 'bold 12px system-ui, sans-serif';
                ctx.textAlign = 'center';
                ctx.shadowBlur = 4;
                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.fillText(ft.text, Math.round(ft.x), Math.round(ft.y));
                ctx.restore();
            }

            // Render Personal Checkpoint Pulsing Light
        if (myServerPlayer && raceLights.length > 0) {
            let rState = myServerPlayer.race ? myServerPlayer.race.state : 0;
            let rNext = myServerPlayer.race ? myServerPlayer.race.nextCheckpoint : 1;
            if (rState < 2) {
                let targetLight = 0x3A + rNext;
                let pulse = (Math.sin(Date.now() / 150) + 1) / 2;
                ctx.save();
                ctx.fillStyle = `rgba(46, 204, 113, ${pulse * 0.8})`;
                ctx.shadowColor = '#2ecc71';
                ctx.shadowBlur = 15;
                for (let l of raceLights) {
                    if (l.id === targetLight) ctx.fillRect(l.x, l.y, 32, 32);
                }
                ctx.restore();
            }
            }

            // Render Multiplayer Leaderboard Overlay
            let racers = Object.entries(serverState.players).filter(([id, p]) => p.race && p.race.state === 2).map(([id, p]) => ({ id, race: p.race })).sort((a,b) => (a.race.finishTime - a.race.startTime) - (b.race.finishTime - b.race.startTime));
            if (racers.length > 0) {
                ctx.save();
                ctx.setTransform(1, 0, 0, 1, 0, 0); 
                ctx.fillStyle = 'rgba(0,0,0,0.8)';
                ctx.fillRect(VIEW_W/2 - 150, 60, 300, 50 + racers.length * 30);
                ctx.fillStyle = '#f1c40f';
                ctx.font = 'bold 18px system-ui, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText("RACE RESULTS", VIEW_W/2, 90);
                ctx.font = 'bold 14px monospace';
                racers.forEach((r, idx) => {
                    let diff = r.race.finishTime - r.race.startTime;
                    let m = Math.floor(diff / 60000).toString().padStart(2, '0');
                    let s = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
                    let ms = Math.floor((diff % 1000) / 10).toString().padStart(2, '0');
                let label = r.id === myId ? "YOU" : (serverState.players[r.id]?.alias || r.id.substring(0,4));
                    ctx.fillStyle = r.id === myId ? '#2ecc71' : '#fff';
                    ctx.textAlign = 'left';
                    ctx.fillText(`${idx+1}. ${label}`, VIEW_W/2 - 120, 125 + idx * 30);
                    ctx.textAlign = 'right';
                    ctx.fillText(`${m}:${s}.${ms}`, VIEW_W/2 + 120, 125 + idx * 30);
                });
                ctx.restore();
            }

            ctx.restore();
        }

        async function bootstrapGame() {
            const loaderImg = document.getElementById('loader-img');
            if (loaderImg.complete) loaderImg.style.display = 'block';
            else loaderImg.onload = () => { loaderImg.style.display = 'block'; };
            
            try {
                await assetManager.loadMultiple({
                    // '0xE4': 'assets/enemies/e4-enemy.webp',
                    '0xE5': 'assets/enemies/e5-enemy-384x256.webp'
                });
                document.getElementById('loading-screen').style.display = 'none';
                socket.connect();
                requestAnimationFrame(gameLoop);
            } catch (err) {
                document.getElementById('loading-text').innerText = 'ASSET MOUNT FAILURE';
                console.error('Asset load error:', err);
            }
        }
        bootstrapGame();
    </script>
</body>
