<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity-Farce</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Press Start 2P', monospace;
            color: #fff;
        }

        .game-container {
            width: 95%;
            max-width: 800px;
            margin: 20px auto;
            background-color: #000;
            position: relative;
            overflow: hidden;
            border: 2px solid #333;
        }

        .title-text {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            
            /* Metallic cyan vertical gradient */
            background: linear-gradient(
                to bottom, 
                #ffffff 0%, 
                #87ceeb 30%, 
                #00ffff 50%, 
                #0055aa 85%, 
                #002255 100%
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            
            /* Outline & retro glow */
            -webkit-text-stroke: 1.5px #5798db;
            filter: drop-shadow(0 0 10px rgba(0, 255, 255, 0.7));
            
            text-align: center;
            font-size: clamp(1.8rem, 5vw, 3.2rem);
            letter-spacing: 3px;
        }

        /* Main UI Panel */
        .main-panel {
            background-color: #4a4a4a;
            border-top: 6px solid #6b6b6b;
            border-left: 6px solid #6b6b6b;
            border-right: 6px solid #333;
            border-bottom: 6px solid #333;
            padding: 20px;
        }

        .retro-btn {
            background-color: #555;
            color: #ccc;
            border-top: 4px solid #777;
            border-left: 4px solid #777;
            border-bottom: 4px solid #333;
            border-right: 4px solid #333;
            padding: 15px 20px;
            font-size: 1rem;
            width: 100%;
            text-align: left;
            margin-bottom: 15px;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            justify-content: space-between;
        }

        /* Default button text gradient */
        .retro-btn span {
            background: linear-gradient(to bottom, #eeeeee 0%, #888888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .retro-btn:active {
            border-top: 4px solid #333;
            border-left: 4px solid #333;
            border-bottom: 4px solid #777;
            border-right: 4px solid #777;
        }

        .retro-btn.active {
            background-color: #008b8b; /* Cyan background */
            color: #fff;
            border-top: 4px solid #00b3b3;
            border-left: 4px solid #00b3b3;
            border-bottom: 4px solid #005959;
            border-right: 4px solid #005959;
        }

        /* Active button text gradient */
        .retro-btn.active span {
            background: linear-gradient(to bottom, #ffffff 0%, #00ffff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Right panel styling */
        .right-panel {
            flex-grow: 1;
            background-color: #555;
            border-top: 4px solid #777;
            border-left: 4px solid #777;
            border-bottom: 4px solid #333;
            border-right: 4px solid #333;
            padding: 10px;
            position: relative;
        }

        /* Recessed screen area */
        .screen-area {
            background-color: #000;
            border-top: 4px solid #333;
            border-left: 4px solid #333;
            border-bottom: 4px solid #777;
            border-right: 4px solid #777;
            padding: 15px;
            font-size: 0.8rem;
            line-height: 1.6;
        }

        .hi-score-title {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #555;
            padding: 0 10px;
        }

        /* Hi-score title gradient */
        .hi-score-title span {
            background: linear-gradient(to bottom, #ffffff 0%, #aaaaaa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .text-cyan { color: #00ffff; }
        .text-pink { color: #ff00ff; }
        .text-gray-light { color: #888; }
        .text-gray-label { color: #777; }
        .text-copyright { color: #00a8a8; }

        .gradient-text-cyan {
            background: linear-gradient(to bottom, #00ffff 20%, #0055ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

        .gradient-text-pink {
            background: linear-gradient(to bottom, #ff55ff 20%, #8800aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

        /* Persistent Selected State for Tabs */
        .tab-item.selected-tab {
            background-color: #333;
            border-top: 4px solid #111;
            border-left: 4px solid #111;
            border-bottom: 4px solid #666;
            border-right: 4px solid #666;
        }
        .tab-item.selected-tab span {
            background: linear-gradient(to bottom, #ffffff 0%, #00ffff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 4px rgba(0, 255, 255, 0.6));
        }

        /* New Nav / Arrow Styles */
        .retro-btn:focus {
            /*
            outline: 2px solid #00ffff;
            outline-offset: 2px;
            */
            outline: none;
        }

        .retro-mode-btn:focus {
            outline: 2px solid #00ffff;
            outline-offset: 2px;
        }

        .arrow {
            display: inline-block;
            transition: all 0.1s;
            color: #555;
            font-size: 0.8em;
            vertical-align: middle;
            margin: 0 2px;
            padding: 4px; /* Larger hit area for mouse clicks */
            position: relative;
            top: -4px; /* Push it up to align perfectly with the number */
            cursor: pointer;
        }

        .retro-btn.active .arrow {
            color: #00ffff;
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
            animation: arrow-pulse 1s infinite alternate;
        }

        @keyframes arrow-pulse {
            from { opacity: 1; }
            to { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <div class="stars"></div>

    <div class="game-container">
        <div id="selection-screen" style="height: 200px; position: relative; overflow: hidden; border-radius: 8px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);">
            <!-- UI Elements go here, layered on top of the canvas via absolute positioning -->
            <h1 style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); margin: 0; width: 100%;" class="title-text">GRAVITY-FARCE</h1>
        </div>
        <script type="module">
            import GalaxyBackground from './GalaxyBackground.js';
            
            const container = document.getElementById('selection-screen');
            const galaxy = new GalaxyBackground(container);
        </script>

        <!-- Main Gray Panel -->
        <div class="main-panel flex flex-col md:flex-row gap-6">
            
            <!-- Left Column: Menu Options -->
            <div class="w-full md:w-1/2 flex flex-col">
                <!--
                <div class="mb-4 text-gray-label text-sm tracking-wider">BY STEPHAN WENZLER</div>
                -->
                
                <!-- Multiplayer / Single Player Tabs -->
                <div class="flex gap-4 mb-4 border-b-4 border-gray-600 pb-4">
                    <button class="retro-btn retro-mode-btn tab-item flex-1 !p-2 !mb-0 text-center justify-center !text-xs" tabindex="0">
                        <span>MULTI<br>PLAYER</span>
                    </button>
                    <button class="retro-btn retro-mode-btn tab-item flex-1 !p-2 !mb-0 text-center justify-center !text-xs" tabindex="0">
                        <span>SINGLE<br>PLAYER</span>
                    </button>
                </div>
                
                <button class="retro-btn menu-item has-value" tabindex="0" data-val="0" data-min="0" data-max="49">
                    <span>MISSION</span>
                    <span><span class="arrow left-arrow">◀</span><span class="val">0</span><span class="arrow right-arrow">▶</span></span>
                </button>
                
                <button class="retro-btn menu-item has-value" tabindex="0" data-val="0" data-min="0" data-max="99">
                    <span>RACE</span>
                    <span><span class="arrow left-arrow">◀</span><span class="val">0</span><span class="arrow right-arrow">▶</span></span>
                </button>
                
                <button class="retro-btn menu-item has-value" tabindex="0" data-val="0" data-min="0" data-max="99">
                    <span>DOGFIGHT</span>
                    <span><span class="arrow left-arrow">◀</span><span class="val">0</span><span class="arrow right-arrow">▶</span></span>
                </button>

                <button class="retro-btn menu-item">
                    <span>OPTIONS</span>
                </button>

            </div>

            <!-- Right Column: Hi-Scores -->
            <div class="w-full md:w-1/2 flex flex-col justify-between mt-4 md:mt-0">
                
                <div class="right-panel md:mt-6 mt-4">
                    <div class="hi-score-title">HI-SCORES</div>
                    <div class="flex mt-2">
                        
                        <!-- Rank Numbers Outside the screen -->
                        <div class="flex flex-col mr-3 text-right w-6 pt-[19px] text-[0.8rem] leading-[1.6] gradient-text-pink">
                            <span>1</span><span>2</span><span>3</span><span>4</span><span>5</span>
                            <span>6</span><span>7</span><span>8</span><span>9</span><span>10</span>
                        </div>
                        
                        <!-- High Scores Screen Area -->
                        <div class="screen-area flex-grow">
                            <div class="flex flex-col tracking-widest gradient-text-cyan">
                                <span>000390</span>
                                <span>000340</span>
                                <span>000030</span>
                                <span>000000 <span class="text-teal-900 text-xs tracking-tight">........</span></span>
                                <span>000000 <span class="text-teal-900 text-xs tracking-tight">........</span></span>
                                <span>000000 <span class="text-teal-900 text-xs tracking-tight">........</span></span>
                                <span>000000 <span class="text-teal-900 text-xs tracking-tight">........</span></span>
                                <span>000000 <span class="text-teal-900 text-xs tracking-tight">........</span></span>
                                <span>000000 <span class="text-teal-900 text-xs tracking-tight">........</span></span>
                                <span>000000 <span class="text-teal-900 text-xs tracking-tight">........</span></span>
                            </div>
                        </div>
                    </div>

                <div class="mt-4 text-center">
                    <div class="text-gray-light text-xs mb-2">COURSE 9 RECORD</div>
                    <div class="screen-area" style="padding: 10px;">
                        <span class="gradient-text-cyan text-sm">
                            04:16:70 FRI
                        </span>
                    </div>
                </div>

                </div>

                <!--
                <div class="mt-6 text-right text-xs gradient-text-cyan">
                    &copy; 1989 BY KINGSOFT
                </div>
                -->
                <div class="mt-6 text-right gradient-text-cyan text-nowrap">
                    <a class="mb-4 text-[10px] text-gray-label tracking-wider" href="https://github.com/romland/Gravity-Farce" target="_blank">github.com/romland/Gravity-Farce</a>
                    <div class="mb-4 text-[10px] text-gray-label tracking-wider">ORIGINAL BY STEPHAN WENZLER</div>
                </div>
            </div>

        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tabs = Array.from(document.querySelectorAll('.tab-item'));
            const menuItems = Array.from(document.querySelectorAll('.menu-item'));
            
            let currentTabIndex = 0;
            let currentMenuIndex = 0;
            let inTabs = false; // Start with focus in the menu items

            function renderFocus() {
                // Reset all states
                tabs.forEach(tab => {
                    tab.classList.remove('active', 'selected-tab');
                    tab.style.opacity = '0.5'; // Dim unselected tabs
                });
                menuItems.forEach(item => item.classList.remove('active'));

                // The active tab is always fully opaque (even if focus is in the menu)
                tabs[currentTabIndex].classList.add('selected-tab');
                tabs[currentTabIndex].style.opacity = '1';

                // Highlight and focus the currently active zone
                const target = inTabs ? tabs[currentTabIndex] : menuItems[currentMenuIndex];
                target.classList.add('active');
                
                if (document.activeElement !== target) target.focus();
            }

            function changeValue(item, delta) {
                let val = parseInt(item.dataset.val, 10);
                const min = parseInt(item.dataset.min, 10);
                const max = parseInt(item.dataset.max, 10);
                
                if (delta > 0 && val < max) val++;
                if (delta < 0 && val > min) val--;
                
                item.dataset.val = val;
                item.querySelector('.val').textContent = val;
                
                // Visual bump for the arrow
                const arrow = item.querySelector(delta < 0 ? '.left-arrow' : '.right-arrow');
                if (arrow) {
                    arrow.style.transform = 'scale(1.5)';
                    arrow.style.color = '#fff';
                    setTimeout(() => {
                        arrow.style.transform = '';
                        arrow.style.color = '';
                    }, 100);
                }
            }

            // Init first state
            renderFocus();

            window.addEventListener('keydown', (e) => {
                if (inTabs) {
                    if (e.key === 'ArrowDown') {
                        e.preventDefault();
                        inTabs = false;
                        renderFocus(); // Drops focus straight down to the last used menu item
                    } else if (e.key === 'ArrowUp') {
                        e.preventDefault();
                        inTabs = false;
                        currentMenuIndex = menuItems.length - 1; // Wrap to bottom of menu
                        renderFocus();
                    } else if (e.key === 'ArrowLeft') {
                        e.preventDefault();
                        if (currentTabIndex > 0) currentTabIndex--;
                        renderFocus();
                    } else if (e.key === 'ArrowRight') {
                        e.preventDefault();
                        if (currentTabIndex < tabs.length - 1) currentTabIndex++;
                        renderFocus();
                    }
                } else {
                    // We are in the menu
                    if (e.key === 'ArrowDown') {
                        e.preventDefault();
                        if (currentMenuIndex < menuItems.length - 1) {
                            currentMenuIndex++;
                        } else {
                            inTabs = true; // Wrap down into tabs
                        }
                        renderFocus();
                    } else if (e.key === 'ArrowUp') {
                        e.preventDefault();
                        if (currentMenuIndex > 0) {
                            currentMenuIndex--;
                        } else {
                            inTabs = true; // Move up into tabs
                        }
                        renderFocus();
                    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                        const currentItem = menuItems[currentMenuIndex];
                        if (currentItem.classList.contains('has-value')) {
                            e.preventDefault();
                            changeValue(currentItem, e.key === 'ArrowRight' ? 1 : -1);
                        }
                    }
                }
            });

            // Allow mouse clicks on the arrows
            document.querySelectorAll('.arrow').forEach(arrow => {
                arrow.addEventListener('mousedown', (e) => {
                    e.stopPropagation(); // Prevent the button's own click event from firing twice
                    const item = e.target.closest('.has-value');
                    if (item) {
                        inTabs = false;
                        currentMenuIndex = menuItems.indexOf(item);
                        renderFocus();
                        changeValue(item, e.target.classList.contains('right-arrow') ? 1 : -1);
                    }
                });
            });

            // Sync browser tabbing and mouse clicks with our internal state
            tabs.forEach((tab, index) => {
                const setTab = () => { inTabs = true; currentTabIndex = index; renderFocus(); };
                tab.addEventListener('focus', setTab);
                tab.addEventListener('mousedown', setTab);
            });

            menuItems.forEach((item, index) => {
                const setMenu = () => { inTabs = false; currentMenuIndex = index; renderFocus(); };
                item.addEventListener('focus', setMenu);
                item.addEventListener('mousedown', setMenu);
            });
        });
    </script>
</body>
</html>
